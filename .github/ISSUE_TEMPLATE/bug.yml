name: Bug report
description: Report a reproducible problem in Project Tome.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Please remove private code, credentials, local paths, and personal data from logs or screenshots before submitting.
  - type: checkboxes
    id: duplicate
    attributes:
      label: Existing issue check
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: input
    id: version
    attributes:
      label: Project Tome version or commit
      placeholder: e.g. RELEASE.json version or commit SHA
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Agent host
      placeholder: e.g. Codex, GitHub Copilot in VS Code
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, project type, and relevant tool versions. Do not include secrets.
      placeholder: |
        OS:
        Project language or platform:
        Agent/tool version:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add redacted logs or screenshots only. Never include credentials or private source code.
      render: shell
    validations:
      required: false
