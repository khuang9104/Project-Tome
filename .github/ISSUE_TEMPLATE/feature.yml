name: Feature request
description: Propose a specific improvement to Project Tome.
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        For early ideas or broad workflow discussions, use Discussions instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or engineering problem is not handled well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and its expected outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include links or redacted examples only; do not include private project data.
    validations:
      required: false
